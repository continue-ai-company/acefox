name: AceFox Linux ARM64 release assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable multi-platform pre-release tag
        required: true
        default: acefox-v143.0a1-ai2apps.2
        type: string
      release_version:
        description: AceFox version used in asset names
        required: true
        default: 143.0a1
        type: string
      prerelease:
        description: Publish as a GitHub Pre-release
        required: true
        default: true
        type: boolean
permissions:
  contents: write

concurrency:
  group: acefox-linux-arm64-release
  cancel-in-progress: false

env:
  DEFAULT_RELEASE_TAG: acefox-v143.0a1-ai2apps.2
  DEFAULT_RELEASE_VERSION: 143.0a1

jobs:
  linux-arm64-release:
    name: Build and publish Linux ARM64
    runs-on: [self-hosted, native-build, linux, arm64]
    timeout-minutes: 180

    steps:
      - name: Check out release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          clean: false

      - name: Clean workspace while preserving the incremental build
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$GITHUB_SHA"
          git clean -ffdx -e /obj-linux-arm64-release/

          if [[ -d obj-linux-arm64-release ]]; then
            echo "Reusing Linux ARM64 build cache:"
            du -sh obj-linux-arm64-release
          else
            echo "No existing Linux ARM64 build cache; starting a clean build."
          fi

      - name: Resolve release metadata
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${REQUESTED_TAG:-$DEFAULT_RELEASE_TAG}"
          release_version="${REQUESTED_VERSION:-$DEFAULT_RELEASE_VERSION}"
          prerelease="${REQUESTED_PRERELEASE:-true}"
          release_iteration="${release_tag##*.}"

          [[ "$release_tag" =~ ^acefox-v[0-9A-Za-z._-]+$ ]] || {
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          }
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+[0-9A-Za-z.]*$ ]] || {
            echo "Invalid release version: $release_version" >&2
            exit 1
          }
          [[ "$prerelease" == "true" || "$prerelease" == "false" ]] || {
            echo "Invalid prerelease flag: $prerelease" >&2
            exit 1
          }
          [[ "$release_iteration" =~ ^[0-9]+$ ]] || {
            echo "Release tag must end with a numeric runtime iteration: $release_tag" >&2
            exit 1
          }

          {
            echo "RELEASE_TAG=$release_tag"
            echo "RELEASE_VERSION=$release_version"
            echo "RELEASE_PRERELEASE=$prerelease"
            echo "RELEASE_NAME=AceFox $release_version AI2Apps Runtime $release_iteration"
          } >> "$GITHUB_ENV"

      - name: Build optimized AI2Apps-branded runtime
        env:
          MOZCONFIG: ci/mozconfig/linux-arm64-release
        shell: bash
        run: |
          set -euo pipefail
          ./mach build
          ./mach package

      - name: Create unsigned AppImage and portable ZIP
        shell: bash
        run: |
          set -euo pipefail
          bash ci/release/package-linux-arm64.sh             "$RELEASE_VERSION"             "$RELEASE_TAG"             "$GITHUB_SHA"             "$GITHUB_WORKSPACE/obj-linux-arm64-release"             "$GITHUB_WORKSPACE/obj-linux-arm64-release/release"

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$GITHUB_WORKSPACE/obj-linux-arm64-release/release"
          (
            cd "$release_dir"
            sha256sum --check SHA256SUMS
          )
          jq -e             '.signing.required == false and .signing.status == "unsigned" and (.artifacts | length) == 2'             "$release_dir/runtime-manifest.json"
          test -x "$release_dir/AceFox-${RELEASE_VERSION}-linux-arm64.AppImage"
          test -s "$release_dir/AceFox-${RELEASE_VERSION}-linux-arm64-portable.zip"

      - name: Preserve release assets as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: acefox-linux-arm64-release-assets
          path: obj-linux-arm64-release/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Prepare release notes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/acefox-release-notes.md" <<NOTES_EOF
          AceFox $RELEASE_VERSION, AI2Apps-branded Linux ARM64 runtime.

          Downloads:
          - AppImage for direct desktop launch
          - Portable ZIP containing the native install tree
          - SHA256SUMS and runtime-manifest.json for integrity and provenance

          This Linux build is intentionally unsigned. Verify downloads with SHA256SUMS.

          Build note: Firefox 143 bootstrap artifacts are no longer available. This build uses the host Ubuntu 24.04 ARM64 toolchain, and WASM sandboxed libraries are disabled because that toolchain's WASI libc++ is incompatible with Firefox 143 RLBox linking.
          NOTES_EOF

      - name: Attach assets to existing multi-platform pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api_root="https://api.github.com/repos/$GITHUB_REPOSITORY"
          api_accept="Accept: application/vnd.github+json"
          api_version="X-GitHub-Api-Version: 2022-11-28"
          auth_header="Authorization: Bearer $GH_TOKEN"
          release_dir="$GITHUB_WORKSPACE/obj-linux-arm64-release/release"
          encoded_tag="$(jq -rn --arg tag "$RELEASE_TAG" '$tag | @uri')"

          curl --fail-with-body --silent --show-error \
            -H "$api_accept" -H "$api_version" -H "$auth_header" \
            "$api_root/releases/tags/$encoded_tag" \
            -o "$RUNNER_TEMP/release-response.json"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --argjson prerelease "$RELEASE_PRERELEASE" \
            '.tag_name == $tag and .draft == false and .prerelease == $prerelease' \
            "$RUNNER_TEMP/release-response.json" >/dev/null

          curl --fail-with-body --silent --show-error \
            -H "$api_accept" -H "$api_version" -H "$auth_header" \
            "$api_root/git/ref/tags/$encoded_tag" \
            -o "$RUNNER_TEMP/tag-response.json"
          tag_sha="$(jq -er '.object.sha' "$RUNNER_TEMP/tag-response.json")"
          [[ "$tag_sha" == "$GITHUB_SHA" ]] || {
            echo "Tag $RELEASE_TAG points to $tag_sha, expected $GITHUB_SHA" >&2
            exit 1
          }

          upload_url="$(jq -er '.upload_url | sub("\\{.*"; "")' \
            "$RUNNER_TEMP/release-response.json")"
          uploads_ip="$(curl --fail --silent --show-error \
            -H 'Accept: application/dns-json' \
            'https://cloudflare-dns.com/dns-query?name=uploads.github.com&type=A' \
            | jq -er 'first(.Answer[] | select(.type == 1) | .data)')"
          upload_source_ip="$(ip -j -4 route show default | jq -er '.[0].prefsrc')"
          echo "Using direct uploads.github.com endpoint: $uploads_ip from $upload_source_ip"

          for asset in "$release_dir"/*; do
            asset_name="$(basename "$asset")"
            asset_size="$(stat -c %s "$asset")"
            asset_sha256="$(sha256sum "$asset" | awk '{print $1}')"
            existing_digest="$(jq -r --arg name "$asset_name" \
              '.assets[] | select(.name == $name) | .digest // empty' \
              "$RUNNER_TEMP/release-response.json")"
            existing_size="$(jq -r --arg name "$asset_name" \
              '.assets[] | select(.name == $name) | .size // empty' \
              "$RUNNER_TEMP/release-response.json")"
            if [[ -n "$existing_digest" || -n "$existing_size" ]]; then
              if [[ -n "$existing_digest" ]]; then
                [[ "$existing_digest" == "sha256:$asset_sha256" ]] || {
                  echo "Existing Release asset differs: $asset_name" >&2
                  exit 1
                }
              else
                [[ "$existing_size" == "$asset_size" ]] || {
                  echo "Existing Release asset has the wrong size: $asset_name" >&2
                  exit 1
                }
              fi
              echo "Release asset already matches: $asset_name"
              continue
            fi

            encoded_name="$(jq -rn --arg name "$asset_name" '$name | @uri')"
            case "$asset_name" in
              *.AppImage) content_type="application/octet-stream" ;;
              *.zip) content_type="application/zip" ;;
              *.json) content_type="application/json" ;;
              *) content_type="text/plain" ;;
            esac
            echo "Uploading $asset_name"
            curl --fail-with-body --silent --show-error --retry 3 \
              --interface "$upload_source_ip" \
              --resolve "uploads.github.com:443:$uploads_ip" \
              -X POST -H "$api_accept" -H "$api_version" -H "$auth_header" \
              -H "Content-Type: $content_type" \
              --data-binary @"$asset" \
              "$upload_url?name=$encoded_name" \
              -o "$RUNNER_TEMP/upload-response.json"
            jq -e '.state == "uploaded"' \
              "$RUNNER_TEMP/upload-response.json" >/dev/null
          done

          curl --fail-with-body --silent --show-error \
            -H "$api_accept" -H "$api_version" -H "$auth_header" \
            "$api_root/releases/tags/$encoded_tag" \
            -o "$RUNNER_TEMP/final-release.json"
          for required_name in \
            "AceFox-${RELEASE_VERSION}-linux-arm64.AppImage" \
            "AceFox-${RELEASE_VERSION}-linux-arm64-portable.zip" \
            SHA256SUMS runtime-manifest.json; do
            jq -e --arg name "$required_name" \
              '.assets[] | select(.name == $name and .state == "uploaded")' \
              "$RUNNER_TEMP/final-release.json" >/dev/null
          done
          release_url="$(jq -er '.html_url' "$RUNNER_TEMP/final-release.json")"
          echo "Updated $release_url"
          echo "### Linux ARM64 assets attached to [$RELEASE_TAG]($release_url)" \
            >> "$GITHUB_STEP_SUMMARY"
