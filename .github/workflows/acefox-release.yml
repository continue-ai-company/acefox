name: AceFox Linux ARM64 release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable release tag
        required: true
        default: acefox-v143.0a1-ai2apps.1
        type: string
      release_version:
        description: AceFox version used in asset names
        required: true
        default: 143.0a1
        type: string
      prerelease:
        description: Publish as a GitHub Pre-release
        required: true
        default: true
        type: boolean
permissions:
  contents: write

concurrency:
  group: acefox-linux-arm64-release
  cancel-in-progress: false

env:
  DEFAULT_RELEASE_TAG: acefox-v143.0a1-ai2apps.1
  DEFAULT_RELEASE_VERSION: 143.0a1

jobs:
  linux-arm64-release:
    name: Build and publish Linux ARM64
    runs-on: [self-hosted, native-build, linux, arm64]
    timeout-minutes: 180

    steps:
      - name: Check out release commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="${REQUESTED_TAG:-$DEFAULT_RELEASE_TAG}"
          release_version="${REQUESTED_VERSION:-$DEFAULT_RELEASE_VERSION}"
          prerelease="${REQUESTED_PRERELEASE:-true}"

          [[ "$release_tag" =~ ^acefox-v[0-9A-Za-z._-]+$ ]] || {
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          }
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+[0-9A-Za-z.]*$ ]] || {
            echo "Invalid release version: $release_version" >&2
            exit 1
          }
          [[ "$prerelease" == "true" || "$prerelease" == "false" ]] || {
            echo "Invalid prerelease flag: $prerelease" >&2
            exit 1
          }

          {
            echo "RELEASE_TAG=$release_tag"
            echo "RELEASE_VERSION=$release_version"
            echo "RELEASE_PRERELEASE=$prerelease"
            echo "RELEASE_NAME=AceFox $release_version AI2Apps Runtime 1 (Linux ARM64)"
          } >> "$GITHUB_ENV"

      - name: Build optimized AI2Apps-branded runtime
        env:
          MOZCONFIG: ci/mozconfig/linux-arm64-release
        shell: bash
        run: |
          set -euo pipefail
          ./mach build
          ./mach package

      - name: Create unsigned AppImage and portable ZIP
        shell: bash
        run: |
          set -euo pipefail
          bash ci/release/package-linux-arm64.sh             "$RELEASE_VERSION"             "$RELEASE_TAG"             "$GITHUB_SHA"             "$GITHUB_WORKSPACE/obj-linux-arm64-release"             "$GITHUB_WORKSPACE/obj-linux-arm64-release/release"

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$GITHUB_WORKSPACE/obj-linux-arm64-release/release"
          (
            cd "$release_dir"
            sha256sum --check SHA256SUMS
          )
          jq -e             '.signing.required == false and .signing.status == "unsigned" and (.artifacts | length) == 2'             "$release_dir/runtime-manifest.json"
          test -x "$release_dir/AceFox-${RELEASE_VERSION}-linux-arm64.AppImage"
          test -s "$release_dir/AceFox-${RELEASE_VERSION}-linux-arm64-portable.zip"

      - name: Preserve release assets as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: acefox-linux-arm64-release-assets
          path: obj-linux-arm64-release/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Prepare release notes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/acefox-release-notes.md" <<NOTES_EOF
          AceFox $RELEASE_VERSION, AI2Apps-branded Linux ARM64 runtime.

          Downloads:
          - AppImage for direct desktop launch
          - Portable ZIP containing the native install tree
          - SHA256SUMS and runtime-manifest.json for integrity and provenance

          This Linux build is intentionally unsigned. Verify downloads with SHA256SUMS.

          Build note: Firefox 143 bootstrap artifacts are no longer available. This build uses the host Ubuntu 24.04 ARM64 toolchain, and WASM sandboxed libraries are disabled because that toolchain's WASI libc++ is incompatible with Firefox 143 RLBox linking.
          NOTES_EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api_root="https://api.github.com/repos/$GITHUB_REPOSITORY"
          api_accept="Accept: application/vnd.github+json"
          api_version="X-GitHub-Api-Version: 2022-11-28"
          auth_header="Authorization: Bearer $GH_TOKEN"
          release_dir="$GITHUB_WORKSPACE/obj-linux-arm64-release/release"

          curl --fail --silent --show-error             -H "$api_accept" -H "$api_version" -H "$auth_header"             "$api_root/releases?per_page=100"             -o "$RUNNER_TEMP/existing-releases.json"
          if jq -e --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag)'             "$RUNNER_TEMP/existing-releases.json" >/dev/null; then
            echo "Release tag already exists and is immutable: $RELEASE_TAG" >&2
            exit 1
          fi

          release_body="$(cat "$RUNNER_TEMP/acefox-release-notes.md")"
          jq -n             --arg tag "$RELEASE_TAG"             --arg target "$GITHUB_SHA"             --arg name "$RELEASE_NAME"             --arg body "$release_body"             --argjson prerelease "$RELEASE_PRERELEASE"             '{tag_name: $tag, target_commitish: $target, name: $name, body: $body, draft: true, prerelease: $prerelease}'             > "$RUNNER_TEMP/create-release.json"

          curl --fail-with-body --silent --show-error             -X POST -H "$api_accept" -H "$api_version" -H "$auth_header"             -H "Content-Type: application/json"             --data-binary @"$RUNNER_TEMP/create-release.json"             "$api_root/releases"             -o "$RUNNER_TEMP/release-response.json"

          release_id="$(jq -er '.id' "$RUNNER_TEMP/release-response.json")"
          upload_url="$(jq -er '.upload_url | sub("\\{.*"; "")' "$RUNNER_TEMP/release-response.json")"

          for asset in "$release_dir"/*; do
            asset_name="$(basename "$asset")"
            encoded_name="$(jq -rn --arg name "$asset_name" '$name | @uri')"
            case "$asset_name" in
              *.AppImage) content_type="application/octet-stream" ;;
              *.zip) content_type="application/zip" ;;
              *.json) content_type="application/json" ;;
              *) content_type="text/plain" ;;
            esac

            echo "Uploading $asset_name"
            curl --fail-with-body --silent --show-error --retry 3               -X POST -H "$api_accept" -H "$api_version" -H "$auth_header"               -H "Content-Type: $content_type"               --data-binary @"$asset"               "$upload_url?name=$encoded_name"               -o "$RUNNER_TEMP/upload-response.json"
            jq -e '.state == "uploaded"' "$RUNNER_TEMP/upload-response.json" >/dev/null
          done

          jq -n             --argjson prerelease "$RELEASE_PRERELEASE"             '{draft: false, prerelease: $prerelease}'             > "$RUNNER_TEMP/publish-release.json"
          curl --fail-with-body --silent --show-error             -X PATCH -H "$api_accept" -H "$api_version" -H "$auth_header"             -H "Content-Type: application/json"             --data-binary @"$RUNNER_TEMP/publish-release.json"             "$api_root/releases/$release_id"             -o "$RUNNER_TEMP/published-release.json"

          jq -er '.html_url' "$RUNNER_TEMP/published-release.json"
