name: AceFox Windows x64 release assets

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful AceFox Windows build run ID
        required: true
        type: string
      release_tag:
        description: Existing multi-platform pre-release tag
        required: true
        default: acefox-v143.0a1-ai2apps.2
        type: string
      release_version:
        description: AceFox version used in release asset names
        required: true
        default: 143.0a1
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: acefox-windows-x64-release
  cancel-in-progress: false

jobs:
  publish-windows-x64:
    name: Attach unsigned Windows x64 runtime
    runs-on: [self-hosted, acefox, native-build, windows, x64]
    timeout-minutes: 60
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_VERSION: ${{ inputs.release_version }}

    steps:
      - name: Validate source build and reusable workspace
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell -NoProfile -command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_RUN_ID -notmatch '^[0-9]+$') {
            throw "Invalid source run ID: $env:SOURCE_RUN_ID"
          }
          if ($env:RELEASE_TAG -notmatch '^acefox-v[0-9A-Za-z._-]+$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }
          if ($env:RELEASE_VERSION -notmatch '^[0-9]+\.[0-9]+[0-9A-Za-z.]*$') {
            throw "Invalid release version: $env:RELEASE_VERSION"
          }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $apiRoot = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $sourceRun = Invoke-RestMethod `
            -Headers $headers `
            -Uri "$apiRoot/actions/runs/$env:SOURCE_RUN_ID"
          if ($sourceRun.conclusion -ne 'success' -or
              $sourceRun.event -ne 'workflow_dispatch' -or
              $sourceRun.head_branch -ne 'acefox/143' -or
              $sourceRun.path -ne '.github/workflows/acefox-build.yml') {
            throw "Run $env:SOURCE_RUN_ID is not a successful AceFox build workflow run"
          }

          $source = 'D:\Workspace\continueAI\acefox'
          if (-not (Test-Path -LiteralPath "$source\mach")) {
            throw "Reusable source workspace not found: $source"
          }
          Set-Location -LiteralPath $source
          $localCommit = (git rev-parse HEAD).Trim()
          if ($localCommit -ne $sourceRun.head_sha) {
            throw "Reusable workspace is at $localCommit, expected $($sourceRun.head_sha)"
          }
          "SOURCE_SHA=$($sourceRun.head_sha)" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Stage validated Windows assets from native build host
        shell: powershell -NoProfile -command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'D:\Workspace\continueAI\acefox\obj-x86_64-pc-windows-msvc\dist'
          $assets = Join-Path $env:RUNNER_TEMP 'windows-release-assets'
          if (Test-Path -LiteralPath $assets) {
            Remove-Item -LiteralPath $assets -Recurse -Force
          }
          New-Item -ItemType Directory -Path $assets -Force | Out-Null
          $packages = Get-ChildItem -LiteralPath $dist -File |
            Where-Object Name -Match '\.win64\.(zip|installer\.exe)$'
          if ($packages.Count -ne 2) {
            throw "Expected portable ZIP and installer, found $($packages.Count)"
          }
          $installer = $packages | Where-Object Name -Like '*.installer.exe'
          $portable = $packages | Where-Object Name -Like '*.zip'
          Copy-Item -LiteralPath $installer.FullName `
            -Destination (Join-Path $assets "AceFox-$env:RELEASE_VERSION-windows-x64-setup.exe") -Force
          Copy-Item -LiteralPath $portable.FullName `
            -Destination (Join-Path $assets "AceFox-$env:RELEASE_VERSION-windows-x64-portable.zip") -Force
          $checksums = foreach ($package in Get-ChildItem -LiteralPath $assets -File) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $package.FullName).Hash.ToLowerInvariant()
            "$hash  $($package.Name)"
          }
          $checksumText = ($checksums -join "`n") + "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $assets 'SHA256SUMS-windows-x64.txt'),
            $checksumText,
            [System.Text.Encoding]::ASCII
          )

      - name: Verify Windows assets
        shell: powershell -NoProfile -command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:RUNNER_TEMP 'windows-release-assets'
          $checksumFile = Join-Path $assets 'SHA256SUMS-windows-x64.txt'
          if (-not (Test-Path -LiteralPath $checksumFile)) {
            throw 'SHA256SUMS-windows-x64.txt is missing'
          }
          $expected = @{}
          foreach ($line in Get-Content -LiteralPath $checksumFile) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') {
              throw "Invalid checksum line: $line"
            }
            $expected[$matches[2]] = $matches[1]
          }
          $packages = Get-ChildItem -LiteralPath $assets -File |
            Where-Object Name -Match '^AceFox-.*-windows-x64-(portable\.zip|setup\.exe)$'
          if ($packages.Count -ne 2 -or $expected.Count -ne 2) {
            throw "Expected exactly two Windows packages and checksum entries"
          }
          foreach ($package in $packages) {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $package.FullName).Hash.ToLowerInvariant()
            if ($expected[$package.Name] -ne $actual) {
              throw "Checksum mismatch: $($package.Name)"
            }
          }

      - name: Preserve Windows release assets as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: acefox-windows-x64-release-assets
          path: ${{ runner.temp }}/windows-release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Attach assets to existing multi-platform pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell -NoProfile -command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $apiRoot = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $releases = Invoke-RestMethod -Headers $headers -Uri "$apiRoot/releases?per_page=100"
          $release = $releases | Where-Object tag_name -EQ $env:RELEASE_TAG | Select-Object -First 1
          if (-not $release) {
            throw "Existing multi-platform release was not found: $env:RELEASE_TAG"
          }
          if ($release.draft -or -not $release.prerelease) {
            throw "Expected a published pre-release: $env:RELEASE_TAG"
          }

          $uploadUrl = $release.upload_url -replace '\{.*$', ''
          $assetsDir = Join-Path $env:RUNNER_TEMP 'windows-release-assets'
          foreach ($asset in Get-ChildItem -LiteralPath $assetsDir -File) {
            $assetHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset.FullName).Hash.ToLowerInvariant()
            $existing = $release.assets | Where-Object name -EQ $asset.Name | Select-Object -First 1
            if ($existing) {
              if ($existing.digest) {
                if ($existing.digest -ne "sha256:$assetHash") {
                  throw "Existing release asset differs: $($asset.Name)"
                }
              } elseif ($existing.size -ne $asset.Length) {
                throw "Existing release asset has the wrong size: $($asset.Name)"
              }
              "Release asset already matches: $($asset.Name)"
              continue
            }

            $encodedName = [uri]::EscapeDataString($asset.Name)
            $contentType = switch -Regex ($asset.Name) {
              '\.zip$' { 'application/zip'; break }
              '\.exe$' { 'application/vnd.microsoft.portable-executable'; break }
              default { 'text/plain' }
            }
            $curlArguments = @(
              '--fail-with-body', '--silent', '--show-error', '--retry', '3',
              '-X', 'POST',
              '-H', 'Accept: application/vnd.github+json',
              '-H', 'X-GitHub-Api-Version: 2022-11-28',
              '-H', "Authorization: Bearer $env:GH_TOKEN",
              '-H', "Content-Type: $contentType",
              '--data-binary', "@$($asset.FullName)",
              "${uploadUrl}?name=$encodedName"
            )
            & curl.exe @curlArguments
            if ($LASTEXITCODE -ne 0) {
              throw "Release upload failed: $($asset.Name)"
            }
          }

          @(
            '### Windows x64 assets attached',
            '',
            "- Source build run: $env:SOURCE_RUN_ID",
            "- Source commit: ``$env:SOURCE_SHA``",
            "- Release: $($release.html_url)"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
