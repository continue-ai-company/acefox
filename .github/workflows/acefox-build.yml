name: AceFox build validation

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native target to build
        required: true
        default: all
        type: choice
        options:
          - all
          - macos-arm64
          - linux-arm64
          - windows-x64

permissions:
  contents: read

jobs:
  macos-arm64:
    name: macos-arm64
    if: inputs.target == 'all' || inputs.target == 'macos-arm64'
    runs-on: [self-hosted, acefox, native-build, macos, arm64]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Report native build host
        shell: bash
        run: |
          ./mach --help >/dev/null
          df -h .
      - name: Build and package
        shell: bash
        run: |
          ./mach build
          ./mach package
      - name: Upload unsigned build output
        uses: actions/upload-artifact@v4
        with:
          name: acefox-macos-arm64
          path: obj-*/dist/**
          if-no-files-found: error
          retention-days: 7

  linux-arm64:
    name: linux-arm64
    if: inputs.target == 'all' || inputs.target == 'linux-arm64'
    runs-on: [self-hosted, acefox, native-build, linux, arm64]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Report native build host
        shell: bash
        run: |
          ./mach --help >/dev/null
          df -h .
      - name: Build and package
        shell: bash
        env:
          MOZCONFIG: ci/mozconfig/linux-arm64
        run: |
          ./mach build
          ./mach package
      - name: Upload unsigned build output
        uses: actions/upload-artifact@v4
        with:
          name: acefox-linux-arm64
          path: obj-*/dist/**
          if-no-files-found: error
          retention-days: 7

  windows-x64:
    name: windows-x64
    if: inputs.target == 'all' || inputs.target == 'windows-x64'
    runs-on: [self-hosted, acefox, native-build, windows, x64]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Report native build host
        shell: bash
        run: |
          ./mach --help >/dev/null
          df -h .
      - name: Build and package
        shell: bash
        run: |
          ./mach build
          ./mach package
      - name: Upload unsigned build output
        uses: actions/upload-artifact@v4
        with:
          name: acefox-windows-x64
          path: obj-*/dist/**
          if-no-files-found: error
          retention-days: 7
