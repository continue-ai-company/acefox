name: AceFox build validation

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native target to build
        required: true
        default: all
        type: choice
        options:
          - all
          - macos-arm64
          - publish-macos-arm64
          - linux-arm64
          - windows-x64
      source_run_id:
        description: Successful macOS build run ID (publish-macos-arm64 only)
        required: false
        type: string
      release_tag:
        description: Existing multi-platform pre-release tag
        required: false
        default: acefox-v143.0a1-ai2apps.2
        type: string
      release_version:
        description: AceFox version used in macOS release asset names
        required: false
        default: 143.0a1
        type: string
      reuse_packaged_windows:
        description: Reuse the validated Windows package already present on the runner
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  publish-macos-arm64:
    name: publish-macos-arm64
    if: inputs.target == 'publish-macos-arm64'
    uses: ./.github/workflows/acefox-publish-macos-arm64.yml
    with:
      source_run_id: ${{ inputs.source_run_id }}
      release_tag: ${{ inputs.release_tag }}
      release_version: ${{ inputs.release_version }}

  macos-arm64:
    name: macos-arm64
    if: inputs.target == 'all' || inputs.target == 'macos-arm64'
    runs-on: [self-hosted, acefox, native-build, macos, arm64]
    timeout-minutes: 360
    env:
      MOZCONFIG: ci/mozconfig/macos-arm64
      PYTHON_CMD: /opt/homebrew/bin/python3.12
      DEVELOPER_DIR: /Applications/Xcode-16.4.app/Contents/Developer
      CCACHE: /opt/homebrew/bin/sccache
      RUSTC_WRAPPER: /opt/homebrew/bin/sccache
      SCCACHE_CACHE_SIZE: 50G
      SCCACHE_VERBOSE_STATS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false
      - name: Prepare persistent native build caches
        shell: bash
        run: |
          set -euo pipefail
          cache_root="${RUNNER_WORKSPACE:?}/_acefox-cache"
          objdir="$cache_root/obj-macos-arm64"
          sccache_dir="$cache_root/sccache"
          mkdir -p "$objdir" "$sccache_dir"
          {
            echo "ACEFOX_MOZ_OBJDIR=$objdir"
            echo "SCCACHE_DIR=$sccache_dir"
          } >> "$GITHUB_ENV"
          SCCACHE_DIR="$sccache_dir" "$CCACHE" --start-server
      - name: Configure macOS native toolchain
        shell: bash
        run: |
          {
            echo '/opt/homebrew/opt/lld/bin'
            echo '/Users/agenthub/.cargo/bin'
          } >> "$GITHUB_PATH"
          {
            echo 'WASM_CC=/opt/homebrew/opt/llvm/bin/clang -Wno-deprecated'
            echo 'WASM_CXX=/opt/homebrew/opt/llvm/bin/clang++ -Wno-deprecated'
            echo 'WASI_SYSROOT=/opt/homebrew/share/wasi-sysroot'
          } >> "$GITHUB_ENV"
      - name: Report native build host
        shell: bash
        run: |
          "$PYTHON_CMD" ./mach --help >/dev/null
          df -h .
      - name: Build and package
        shell: bash
        run: |
          "$PYTHON_CMD" ./mach build
          "$PYTHON_CMD" ./mach package
      - name: Stage unsigned build output
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/acefox-macos-artifact"
          rm -rf "$output"
          mkdir -p "$output"
          cp -a "$ACEFOX_MOZ_OBJDIR/dist/." "$output/"
      - name: Upload unsigned build output
        uses: actions/upload-artifact@v4
        with:
          name: acefox-macos-arm64
          path: ${{ runner.temp }}/acefox-macos-artifact/**
          if-no-files-found: error
          retention-days: 7
      - name: Report compiler-cache statistics
        if: ${{ always() }}
        shell: bash
        run: '"$CCACHE" --show-stats'

  linux-arm64:
    name: linux-arm64
    if: inputs.target == 'all' || inputs.target == 'linux-arm64'
    runs-on: [self-hosted, acefox, native-build, linux, arm64]
    timeout-minutes: 360
    env:
      MOZCONFIG: ci/mozconfig/linux-arm64-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false
      - name: Clean workspace while preserving the incremental build
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$GITHUB_SHA"
          git clean -ffdx -e /obj-linux-arm64-release/

          if [[ -d obj-linux-arm64-release ]]; then
            echo "Reusing Linux ARM64 build cache:"
            du -sh obj-linux-arm64-release
          else
            echo "No existing Linux ARM64 build cache; starting a clean build."
          fi
      - name: Report native build host
        shell: bash
        run: |
          ./mach --help >/dev/null
          df -h .
      - name: Build and package
        shell: bash
        run: |
          ./mach build
          ./mach package
      - name: Upload unsigned build output
        uses: actions/upload-artifact@v4
        with:
          name: acefox-linux-arm64
          path: obj-linux-arm64-release/dist/**
          if-no-files-found: error
          retention-days: 7

  windows-x64:
    name: windows-x64
    if: inputs.target == 'all' || inputs.target == 'windows-x64'
    runs-on: [self-hosted, acefox, native-build, windows, x64]
    timeout-minutes: 360
    steps:
      - name: Verify reusable Windows workspace
        shell: powershell -NoProfile -command ". '{0}'"
        run: |
          $source = 'D:\Workspace\continueAI\acefox'
          if (-not (Test-Path -LiteralPath "$source\mach")) {
            throw "Reusable source workspace not found: $source"
          }
          Set-Location -LiteralPath $source
          $localCommit = (git rev-parse HEAD).Trim()
          if ($localCommit -ne $env:GITHUB_SHA) {
            throw "Reusable workspace is at $localCommit, expected $env:GITHUB_SHA"
          }
          & 'C:\mozilla-build\python3\python.exe' '.\mach' '--help' | Out-Null
          Get-PSDrive -Name C,D | Format-Table -AutoSize

      - name: Incremental build and package
        if: ${{ !inputs.reuse_packaged_windows }}
        shell: powershell -NoProfile -command ". '{0}'"
        run: |
          Get-ChildItem Env: |
            Where-Object Name -Like 'CONDA*' |
            Remove-Item
          $env:Path = (($env:Path -split ';') |
            Where-Object { $_ -and $_ -notmatch '(?i)(miniconda|anaconda|conda)' }) -join ';'
          $env:MACH_HIDE_DEV_DRIVE_SUGGESTION = '1'
          Set-Location -LiteralPath 'D:\Workspace\continueAI\acefox'
          & 'C:\mozilla-build\python3\python.exe' '.\mach' 'build'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'C:\mozilla-build\python3\python.exe' '.\mach' 'package'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test and stage artifacts
        shell: powershell -NoProfile -command ". '{0}'"
        run: |
          $source = 'D:\Workspace\continueAI\acefox'
          $dist = "$source\obj-x86_64-pc-windows-msvc\dist"
          $output = Join-Path $env:GITHUB_WORKSPACE 'release-output'
          if (Test-Path -LiteralPath $output) {
            Remove-Item -LiteralPath $output -Recurse -Force
          }
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $profile = Join-Path $env:RUNNER_TEMP 'acefox-smoke-profile'
          $screenshot = Join-Path $env:RUNNER_TEMP 'acefox-smoke.png'
          New-Item -ItemType Directory -Path $profile -Force | Out-Null
          $process = Start-Process -FilePath "$dist\bin\firefox.exe" `
            -ArgumentList @('--headless', '--no-remote', '--profile', $profile, '--screenshot', $screenshot, 'about:blank') `
            -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(60000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Smoke test timed out after 60 seconds'
          }
          if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $screenshot)) {
            throw "Smoke test failed with exit code $($process.ExitCode)"
          }
          $artifacts = Get-ChildItem -LiteralPath $dist -File |
            Where-Object Name -Match '\.win64\.(zip|installer\.exe)$'
          if ($artifacts.Count -ne 2) {
            throw "Expected portable ZIP and installer, found $($artifacts.Count)"
          }
          Copy-Item -LiteralPath $artifacts.FullName -Destination $output
          $checksums = foreach ($artifact in Get-ChildItem -LiteralPath $output -File) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.FullName).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }
          $checksumText = ($checksums -join "`n") + "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $output 'SHA256SUMS.txt'),
            $checksumText,
            [System.Text.Encoding]::ASCII
          )

      - name: Upload unsigned build output
        uses: actions/upload-artifact@v4
        with:
          name: acefox-windows-x64
          path: release-output/*
          if-no-files-found: error
          retention-days: 7
